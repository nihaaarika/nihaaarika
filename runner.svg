<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 110" width="100%" height="110">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A66C2"/>
      <stop offset="1" stop-color="#6C63FF"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="96" x2="800" y2="96" stroke="#6C63FF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 10"/>

  <g>
    <animateTransform attributeName="transform" type="translate" from="-90 0" to="840 0" dur="9s" repeatCount="indefinite"/>

    <g stroke="#6C63FF" stroke-width="2" stroke-linecap="round">
      <line x1="-30" y1="45" x2="-48" y2="45"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="0.5s" repeatCount="indefinite"/></line>
      <line x1="-30" y1="58" x2="-58" y2="58"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="0.5s" repeatCount="indefinite"/></line>
      <line x1="-30" y1="71" x2="-44" y2="71"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="0.5s" repeatCount="indefinite"/></line>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.4s" repeatCount="indefinite"/>

      <!-- back arm and leg -->
      <g transform="translate(0,48)" opacity="0.55">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="35 0 0;-35 0 0;35 0 0" dur="0.8s" repeatCount="indefinite"/>
          <rect x="-3" y="0" width="6" height="18" rx="3" fill="#6C63FF"/>
        </g>
      </g>
      <g transform="translate(0,66)" opacity="0.55">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-35 0 0;35 0 0;-35 0 0" dur="0.8s" repeatCount="indefinite"/>
          <rect x="-3.5" y="0" width="7" height="28" rx="3.5" fill="#0A66C2"/>
        </g>
      </g>

      <!-- body -->
      <rect x="-12" y="40" width="24" height="30" rx="7" fill="url(#g)"/>
      <circle cx="0" cy="55" r="3" fill="#ffffff" fill-opacity="0.9"/>

      <!-- head -->
      <line x1="0" y1="18" x2="0" y2="10" stroke="#6C63FF" stroke-width="2"/>
      <circle cx="0" cy="8" r="3" fill="#6C63FF">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <rect x="-12" y="18" width="24" height="19" rx="6" fill="url(#g)"/>
      <rect x="-6" y="23" width="17" height="9" rx="4.5" fill="#ffffff"/>
      <circle cx="5" cy="27.5" r="2.2" fill="#0A66C2"/>

      <!-- front arm and leg -->
      <g transform="translate(0,48)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-35 0 0;35 0 0;-35 0 0" dur="0.8s" repeatCount="indefinite"/>
          <rect x="-3" y="0" width="6" height="18" rx="3" fill="#6C63FF"/>
        </g>
      </g>
      <g transform="translate(0,66)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="35 0 0;-35 0 0;35 0 0" dur="0.8s" repeatCount="indefinite"/>
          <rect x="-3.5" y="0" width="7" height="28" rx="3.5" fill="#0A66C2"/>
        </g>
      </g>
    </g>
  </g>
</svg>
